name: Feature request
description: Suggest an improvement for the beta.
title: "[Feature]: "
labels: [feature, beta-feedback]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you are trying to solve
    validations:
      required: true
  - type: textarea
    id: requested-behavior
    attributes:
      label: Requested behavior
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why would this help?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area would this affect?
      options:
        - Scanning
        - Review results
        - Export
        - Installation
        - Another area
    validations:
      required: true
